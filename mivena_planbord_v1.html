<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Mivena — Planbord</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script>
// Laad MSAL dynamisch met fallback CDN
(function() {
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/@azure/msal-browser@2.39.0/lib/msal-browser.min.js';
  s.onerror = function() {
    var s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js';
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
})();
</script>
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════ */
:root {
  --groen:      #1B4332;
  --groen-dark: #0F2B1F;
  --groen-mid:  #2D6A4F;
  --groen-licht:#52B788;
  --groen-zacht:#D8F3DC;
  --amber:      #E9A23D;
  --amber-zacht:#FEF3DC;
  --blauw:      #2558A0;
  --blauw-zacht:#E8F0FB;
  --bg:         #F0F4EE;
  --wit:        #FFFFFF;
  --tekst:      #1A211C;
  --muted:      #6B7570;
  --lijn:       #DEE5DA;
  --rood:       #C0392B;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--tekst);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ═══════════════════════════════════════
   STATUS BALK (LIVE / DEMO)
═══════════════════════════════════════ */
.status-balk {
  padding: 5px 20px;
  font-size: 11.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  background: var(--amber-zacht);
  border-bottom: 1px solid #E8D49A;
  color: #7A4E0A;
}
.status-balk.live {
  background: #EAF6EE;
  border-bottom-color: #B2DDBF;
  color: #1A5E35;
}
.status-pill {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--amber);
  color: #fff;
}
.status-balk.live .status-pill {
  background: var(--groen-mid);
}

/* ═══════════════════════════════════════
   HEADER
═══════════════════════════════════════ */
.header {
  background: linear-gradient(135deg, var(--groen) 0%, var(--groen-dark) 100%);
  color: #EBF4EE;
  padding: 12px 20px 10px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex: none;
  position: relative;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--groen-licht), #95D5B2);
}
.logo-blok {
  background: #fff;
  border-radius: 7px;
  padding: 5px 10px;
  display: flex;
  align-items: center;
  flex: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.logo-blok img { height: 22px; display: block; }
.logo-fb {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 14px;
  color: var(--groen-dark);
  letter-spacing: .05em;
}
.header-tekst { flex: 1; }
.header-titel {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 17px;
  line-height: 1.2;
}
.header-sub {
  font-size: 11px;
  color: rgba(235,244,238,.6);
  margin-top: 2px;
}
.header-rechts {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.gebruiker-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18);
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  color: #EBF4EE;
}
.online-stip {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--groen-licht);
  box-shadow: 0 0 0 2px rgba(82,183,136,.35);
}
.btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.12);
  color: #EBF4EE;
  transition: background .12s;
  white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,.22); }
.btn.groen { background: rgba(82,183,136,.25); border-color: rgba(82,183,136,.5); }
.bc-stip { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.bc-stip.ok   { background: var(--groen-licht); box-shadow: 0 0 0 2px rgba(82,183,136,.3); }
.bc-stip.busy { background: var(--amber); animation: knip .8s infinite; }
.bc-stip.fout { background: var(--rood); }
@keyframes knip { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ═══════════════════════════════════════
   WEEK NAVIGATIE
═══════════════════════════════════════ */
.week-balk {
  background: var(--wit);
  border-bottom: 1px solid var(--lijn);
  display: flex;
  align-items: stretch;
  flex: none;
}
.week-knop {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 18px;
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--groen);
  transition: background .12s;
  border-right: 1px solid var(--lijn);
}
.week-knop:last-child { border-right: none; border-left: 1px solid var(--lijn); }
.week-knop:hover:not(:disabled) { background: var(--groen-zacht); }
.week-knop:disabled { color: var(--muted); cursor: default; }
.week-knop svg { width: 15px; height: 15px; }

.week-midden {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 10px 20px;
  gap: 18px;
}
.week-info { display: flex; flex-direction: column; gap: 2px; }
.week-rij {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.week-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.week-nr {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 30px;
  color: var(--groen-dark);
  line-height: 1;
}
.huidig-badge {
  background: var(--groen-zacht);
  color: var(--groen-mid);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 2px 9px;
  border-radius: 20px;
}
.week-datums { font-size: 12px; color: var(--muted); }

.week-divider { width: 1px; height: 32px; background: var(--lijn); flex: none; }

.week-totalen { display: flex; align-items: center; gap: 0; }
.wt {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
  padding: 0 14px;
  border-right: 1px solid var(--lijn);
  white-space: nowrap;
}
.wt:last-child { border-right: none; }
.wt-stip { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.wt b { color: var(--tekst); font-weight: 600; }

/* ═══════════════════════════════════════
   TIJDLIJN
═══════════════════════════════════════ */
.tl-scroll {
  flex: 1;
  overflow: auto;
  padding: 12px 16px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--groen-licht) var(--groen-zacht);
  display: flex;
  flex-direction: column;
}
.tl-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
.tl-scroll::-webkit-scrollbar-track { background: var(--groen-zacht); border-radius: 10px; }
.tl-scroll::-webkit-scrollbar-thumb { background: var(--groen-licht); border-radius: 10px; }

/* Tijdlijn = flex rij: rijen-kolom + weekend-knop */
.tijdlijn {
  display: flex;
  flex-direction: row;
  min-width: 850px;
  flex: 1;
  gap: 8px;
  align-items: stretch;
}
.tijdlijn-rijen {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Elke rij = grid met dezelfde kolomindeling (zonder weekend-kolom) */
.tl-rij {
  display: grid;
  grid-template-columns: var(--tl-cols, repeat(5, minmax(160px, 1fr)));
  column-gap: 8px;
  align-items: stretch;
}

/* Drag & drop */
.item[draggable="true"] { cursor: grab; }
.item.sleep-actief { opacity: 0.35; cursor: grabbing; }
.tl-cat-cel.sleep-doel {
  background: rgba(82,183,136,.12);
  outline: 2px dashed var(--groen-licht);
  outline-offset: -2px;
}
.tl-cat-cel.sleep-doel .cat-label { opacity: .5; }

/* Dag-header cel (bovenste stuk per kolom) */
.tl-dag-hoofd {
  padding: 7px 10px 6px;
  border: 1px solid var(--lijn);
  border-bottom: none;
  border-radius: 12px 12px 0 0;
  background: var(--bg);
  text-align: center;
  position: relative;
}
.tl-dag-hoofd.vandaag {
  background: linear-gradient(135deg, var(--groen), var(--groen-dark));
  border-color: var(--groen-licht);
  box-shadow: -1px 0 0 var(--groen-licht), 1px 0 0 var(--groen-licht);
}
.tl-dag-hoofd.weekend { background: #EDF2EA; }
.tl-dag-hoofd.vandaag .dag-naam  { color: rgba(235,244,238,.7); }
.tl-dag-hoofd.vandaag .dag-datum { color: #fff; }
.tl-dag-hoofd.vandaag .dag-maand { color: rgba(235,244,238,.5); }

/* Categorie cel (midden) */
.tl-cat-cel {
  background: var(--wit);
  border-left: 1px solid var(--lijn);
  border-right: 1px solid var(--lijn);
  border-top: 1px solid var(--lijn);
  display: flex;
  flex-direction: column;
  min-height: 90px;
}
.tl-cat-cel .cat-body {
  flex: 1;
  max-height: none;
}
.tl-cat-cel.vandaag {
  border-left-color: var(--groen-licht);
  border-right-color: var(--groen-licht);
}
.tl-cat-cel.weekend { background: #F4F7F2; }

/* Notitie cel (onderste stuk per kolom) */
.tl-not-cel {
  background: var(--wit);
  border: 1px solid var(--lijn);
  border-top: 1px solid var(--lijn);
  border-radius: 0 0 12px 12px;
  padding: 7px 11px 9px;
  display: flex;
  flex-direction: column;
}
.tl-not-cel.vandaag {
  border-color: var(--groen-licht);
  border-top-color: var(--lijn);
}
.tl-not-cel.weekend { background: #F4F7F2; }

/* Lege cel (onder weekend knop) */
.tl-lege-cel { /* placeholder */ }

/* Dag labels (gebruikt in tl-dag-hoofd) */
.dag-hoofd { /* legacy, niet meer in gebruik */ }
.dag-naam {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}
.dag-datum {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 17px;
  line-height: 1;
  color: var(--groen-dark);
}
.dag-maand { font-size: 10px; color: var(--muted); margin-top: 1px; }

.vandaag-pip {
  position: absolute;
  top: -1px; left: 50%;
  transform: translateX(-50%);
  background: var(--groen-licht);
  color: #fff;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 0 0 7px 7px;
}

/* ═══════════════════════════════════════
   CATEGORIE SECTIES
═══════════════════════════════════════ */
.cat-sec {
  border-bottom: 1px solid var(--lijn);
  display: flex;
  flex-direction: column;
}
.cat-sec:last-of-type { border-bottom: none; }

.cat-label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px 5px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  border-left: 3px solid transparent;
}
.cat-label svg { width: 12px; height: 12px; opacity: .9; flex: none; }
.cat-label.inkoop {
  color: var(--blauw);
  background: var(--blauw-zacht);
  border-left-color: var(--blauw);
  border-bottom: 1px solid #C5D6EF;
}
.cat-label.productie {
  color: #9A5010;
  background: #FDF4E7;
  border-left-color: var(--amber);
  border-bottom: 1px solid #EAD09A;
}
.cat-label.transport {
  color: var(--groen-mid);
  background: #EDF7F1;
  border-left-color: var(--groen-licht);
  border-bottom: 1px solid #B2DDBF;
}

.cat-body {
  min-height: 70px;
  max-height: 130px;
  overflow-y: auto;
  padding: 3px 10px 7px;
  scrollbar-width: thin;
  scrollbar-color: var(--lijn) transparent;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.cat-body::-webkit-scrollbar { width: 3px; }
.cat-body::-webkit-scrollbar-thumb { background: var(--lijn); border-radius: 3px; }

.leeg {
  font-size: 11px;
  color: var(--muted);
  font-style: italic;
  padding: 5px 2px 2px;
  opacity: .7;
}

/* ═══════════════════════════════════════
   PLAN ITEMS
═══════════════════════════════════════ */
.item {
  display: flex;
  flex-direction: column;
  padding: 5px 6px 5px 8px;
  border-left: 2.5px solid transparent;
  border-radius: 0 6px 6px 0;
  cursor: pointer;
  transition: background .1s;
  margin: 1px 0;
}
.item:hover { background: rgba(0,0,0,.04); }
.item + .item { border-top: 1px solid var(--lijn); padding-top: 6px; }

.item.inkoop    { border-left-color: var(--blauw); }
.item.productie { border-left-color: var(--amber); }
.item.transport { border-left-color: var(--groen-licht); }

.item-naam {
  font-size: 13px;
  font-weight: 700;
  color: var(--tekst);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.35;
}
.item-sub {
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
  font-weight: 500;
}

/* ═══════════════════════════════════════
   NOTITIE
═══════════════════════════════════════ */
.notitie-sec, .tl-not-cel {
  padding: 7px 11px 9px;
}
.notitie-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.notitie-label svg { width: 10px; height: 10px; }
.notitie-veld {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--lijn);
  border-radius: 6px;
  padding: 5px 8px;
  font-family: 'Inter', sans-serif;
  font-size: 11.5px;
  color: var(--tekst);
  background: #F7FAF5;
  resize: none;
  outline: none;
  line-height: 1.45;
  transition: border-color .12s;
}
.notitie-veld:focus { border-color: var(--groen-licht); background: #fff; }
.notitie-veld::placeholder { color: #B5BEB2; }
.notitie-info { display: flex; gap: 6px; margin-top: 4px; min-height: 16px; align-items: center; }
.notitie-init {
  background: var(--groen);
  color: #EBF4EE;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 1px 6px;
  border-radius: 5px;
}
.notitie-tijd { font-size: 9.5px; color: var(--muted); }
.opgeslagen-ind {
  font-size: 9.5px; color: var(--groen-mid);
  opacity: 0; transition: opacity .3s; height: 12px;
}
.opgeslagen-ind.aan { opacity: 1; }

/* ═══════════════════════════════════════
   WEEKEND KNOP
═══════════════════════════════════════ */
.weekend-blok {
  background: #EEF3EA;
  border: 1px solid var(--lijn);
  border-radius: 12px;
  cursor: pointer;
  flex: none;
  width: 48px;
  align-self: stretch;
  min-height: unset;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background .12s;
  user-select: none;
}
.weekend-blok:hover { background: var(--groen-zacht); border-color: var(--groen-licht); }
.weekend-tekst {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
}
.weekend-blok svg { width: 14px; height: 14px; color: var(--muted); }

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
.modal-achtergrond {
  position: fixed; inset: 0;
  background: rgba(10,25,15,.5);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 90;
  padding: 20px;
}
.modal-achtergrond.open { display: flex; }
.modal {
  background: var(--wit);
  border-radius: 15px;
  max-width: 680px;
  width: 100%;
  max-height: 90vh;
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: in .16s ease;
}
@keyframes in { from{opacity:0;transform:translateY(10px) scale(.97)} to{opacity:1;transform:none} }

.modal-hoofd {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--lijn);
  position: relative;
}
.modal-type {
  display: inline-flex;
  align-items: center;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 2px 10px;
  border-radius: 20px;
  margin-bottom: 7px;
}
.modal-type.inkoop    { background: var(--blauw-zacht); color: var(--blauw); }
.modal-type.productie { background: var(--amber-zacht); color: #9A5010; }
.modal-type.transport { background: var(--groen-zacht); color: var(--groen-mid); }
.modal-naam { font-family: 'Manrope', sans-serif; font-size: 18px; font-weight: 700; color: var(--groen-dark); line-height: 1.2; }
.modal-datum { font-size: 12px; color: var(--muted); margin-top: 4px; }
.modal-sluiten {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px;
  background: var(--bg); border: 1px solid var(--lijn);
  border-radius: 7px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); transition: background .1s;
}
.modal-sluiten:hover { background: var(--lijn); }
.modal-sluiten svg { width: 13px; height: 13px; }

.modal-body {
  padding: 14px 20px 18px;
  overflow-y: auto;
  flex: 1;
}
.rij {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--lijn);
  font-size: 13px;
}
.rij:last-child { border-bottom: none; padding-bottom: 0; }
.rij-label { color: var(--muted); font-weight: 500; min-width: 150px; flex: none; }
.rij-waarde { font-weight: 600; color: var(--tekst); text-align: right; }
.rij-waarde.groot { font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700; color: var(--groen-dark); }

.detail-knop {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding: 10px 16px;
  background: var(--groen-zacht);
  border: 1px solid var(--groen-licht);
  border-radius: 9px;
  color: var(--groen-mid);
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  transition: background .12s;
}
.detail-knop:hover { background: #C0EBD0; }
.detail-knop svg { width: 15px; height: 15px; flex: none; }

.regels-sectie { margin-top: 14px; }
.regels-titel {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  border-top: 1px solid var(--lijn);
  padding-top: 12px;
}
.regels-tabel {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.regels-tabel th {
  text-align: left;
  color: var(--muted);
  font-weight: 700;
  font-size: 10.5px;
  padding: 5px 6px;
  border-bottom: 2px solid var(--lijn);
}
.regels-tabel td {
  padding: 7px 6px;
  border-bottom: 1px solid var(--lijn);

<script>
/* ══════════════════════════════════════
   BC CONFIGURATIE
══════════════════════════════════════ */
const BC_TENANT  = 'ff954f83-094a-461a-95f0-cb27bddcd2fc';
const BC_CLIENT  = 'a9cf76ae-6515-4930-98cc-b0aaecc7c7a9';
const BC_REDIR   = window.location.href.split('?')[0].split('#')[0];
const BC_ENV     = 'MivenaBV';
const BC_CO_NAAM = 'WK46 Test';
const BC_SCOPE   = 'https://api.businesscentral.dynamics.com/user_impersonation';
const BC_API     = `https://api.businesscentral.dynamics.com/v2.0/${BC_TENANT}/${BC_ENV}/api/v2.0`;

/* ══════════════════════════════════════
   STAAT
══════════════════════════════════════ */
let msalApp      = null;
let bcToken      = null;
let bcBedrijfId  = null;
let verbonden    = false;
let liveData     = null;
let gebruikerNaamVol = 'Gebruiker';

function initialen(naam) {
  const stop = ['de','van','der','den','te','ten','ter','op','in','het'];
  const delen = naam.trim().split(/\s+/).filter(d => !stop.includes(d.toLowerCase()));
  if (!delen.length) return naam[0]?.toUpperCase() || '?';
  if (delen.length === 1) return delen[0][0].toUpperCase();
  return (delen[0][0] + delen[delen.length-1][0]).toUpperCase();
}
let gebruikerInit = 'G';

/* ══════════════════════════════════════
   DATUM HELPERS
══════════════════════════════════════ */
const VANDAAG = new Date(); VANDAAG.setHours(0,0,0,0);

const DAGnamen  = ['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];
const MAANDNAMEN = ['januari','februari','maart','april','mei','juni',
                    'juli','augustus','september','oktober','november','december'];

function iso(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }
function plusDagen(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isMaandag(d) { return d.getDay() === 1; }
function isWeekend(d) { const w = d.getDay(); return w === 0 || w === 6; }

function maandag(d) {
  const r = new Date(d);
  const dag = r.getDay();
  r.setDate(r.getDate() - (dag === 0 ? 6 : dag - 1));
  return r;
}
function isoWeekNr(d) {
  const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dow = tmp.getUTCDay() || 7;
  tmp.setUTCDate(tmp.getUTCDate() + 4 - dow);
  const j1 = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
  return Math.ceil((((tmp - j1) / 86400000) + 1) / 7);
}
function fKg(n) { return (n||0).toLocaleString('nl-NL') + ' kg'; }
function fDatum(d) {
  const dt = new Date(d);
  return `${dt.getDate()} ${MAANDNAMEN[dt.getMonth()]} ${dt.getFullYear()}`;
}

/* ══════════════════════════════════════
   NAVIGATIE
══════════════════════════════════════ */
const WEEK0  = maandag(VANDAAG);
const MAX_P  = 4;
let pagina   = 0;

function weekDagen(p) {
  return Array.from({length:7}, (_,i) => plusDagen(WEEK0, p*7 + i));
}

/* ══════════════════════════════════════
   NOTITIES
══════════════════════════════════════ */
const notities = {};

/* ══════════════════════════════════════
   ITEM OPSLAG (voor modal)
══════════════════════════════════════ */
const opslag = [];
function bewaar(obj) { const i = opslag.length; opslag.push(obj); return i; }

/* ══════════════════════════════════════
   WEEKEND TONEN
══════════════════════════════════════ */
let weekendOpen = false;
function toggleWeekend() {
  weekendOpen = !weekendOpen;
  teken();
  toon('Weekend ' + (weekendOpen ? 'zichtbaar' : 'verborgen'));
}

/* ══════════════════════════════════════
   SVG ICONEN
══════════════════════════════════════ */
const ICO_INKOOP = `<svg viewBox="0 0 24 24" fill="none"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="3.27 6.96 12 12.01 20.73 6.96" stroke="currentColor" stroke-width="2"/><line x1="12" y1="22.08" x2="12" y2="12" stroke="currentColor" stroke-width="2"/></svg>`;
const ICO_PROD   = `<svg viewBox="0 0 24 24" fill="none"><path d="M3 7l9-4 9 4-9 4-9-4zm0 5l9 4 9-4M3 17l9 4 9-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICO_TRANS  = `<svg viewBox="0 0 24 24" fill="none"><rect x="1" y="3" width="15" height="13" rx="1" stroke="currentColor" stroke-width="2"/><path d="M16 8h4l3 3v5h-7V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5.5" cy="18.5" r="2.5" stroke="currentColor" stroke-width="2"/><circle cx="18.5" cy="18.5" r="2.5" stroke="currentColor" stroke-width="2"/></svg>`;
const ICO_PEN    = `<svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ══════════════════════════════════════
   MSAL / BC KOPPELING
══════════════════════════════════════ */
async function initMsal() {
  // Wacht tot msal beschikbaar is (max 8 seconden)
  for (let i = 0; i < 40; i++) {
    if (typeof msal !== 'undefined') break;
    await new Promise(r => setTimeout(r, 200));
  }
  if (typeof msal === 'undefined') {
    console.error('MSAL library niet geladen');
    return;
  }
  try {
    msalApp = new msal.PublicClientApplication({
      auth: {
        clientId:    BC_CLIENT,
        authority:   `https://login.microsoftonline.com/${BC_TENANT}`,
        redirectUri: BC_REDIR
      },
      cache: { cacheLocation: 'sessionStorage' }
    });
    await msalApp.initialize();

    // Verwerk redirect na login
    const res = await msalApp.handleRedirectPromise().catch(() => null);
    if (res) {
      await bijVerbonden(res);
      return;
    }

    // Probeer stille login met bestaande sessie
    const accounts = msalApp.getAllAccounts();
    if (accounts.length > 0) {
      const stil = await msalApp.acquireTokenSilent({
        scopes: [BC_SCOPE],
        account: accounts[0]
      }).catch(() => null);
      if (stil) await bijVerbonden(stil);
    }
  } catch(e) {
    console.warn('MSAL init fout:', e);
    msalApp = null;
  }
  updateBCKnop();
}

async function toggleBC() {
  if (verbonden) {
    verbonden = false; bcToken = null; bcBedrijfId = null; liveData = null;
    msalApp?.clearCache();
    updateBCKnop();
    teken();
    toon('Losgekoppeld van Business Central');
    return;
  }
  if (!msalApp) {
    toon('Pagina herladen en opnieuw proberen (F5)');
    return;
  }
  // Gebruik redirect (geen popup) — pagina gaat naar Microsoft en keert terug
  updateBCKnop('bezig');
  try {
    await msalApp.loginRedirect({ scopes: [BC_SCOPE] });
  } catch(e) {
    toon('Inloggen mislukt: ' + (e.errorMessage || e.message || 'onbekende fout'));
    updateBCKnop();
  }
}

async function bijVerbonden(res) {
  bcToken = res.accessToken;

  if (res.account?.name) {
    gebruikerNaamVol = res.account.name;
    gebruikerInit    = initialen(gebruikerNaamVol);
    document.getElementById('gebruikerNaam').textContent = gebruikerInit + ' · ' + gebruikerNaamVol;
  }

  updateBCKnop('bezig');

  // Bedrijf zoeken
  const bedrijven = await bcGet('/companies');
  const bedrijf   = (bedrijven.value || []).find(c => c.name === BC_CO_NAAM)
                 || (bedrijven.value || [])[0];

  if (!bedrijf) throw new Error(`Bedrijf "${BC_CO_NAAM}" niet gevonden`);
  bcBedrijfId = bedrijf.id;
  verbonden   = true;

  toon('Verbonden met ' + bedrijf.name);
  await haalData();
}

/* ══════════════════════════════════════
   BC API
══════════════════════════════════════ */
async function bcGet(pad) {
  const url = pad.startsWith('http') ? pad : BC_API + pad;
  const r = await fetch(url, { headers: { Authorization: `Bearer ${bcToken}` } });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    throw new Error(`BC ${r.status}: ${t.substring(0, 180)}`);
  }
  return r.json();
}

async function bcPatch(pad, body) {
  const url = BC_API + pad;
  const r = await fetch(url, {
    method: 'PATCH',
    headers: {
      'Authorization': `Bearer ${bcToken}`,
      'Content-Type': 'application/json',
      'If-Match': '*',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    console.error('BC PATCH fout:', t);
    // Probeer foutmelding te parsen
    try {
      const err = JSON.parse(t);
      const msg = err?.error?.message || err?.message || t;
      throw new Error(msg.substring(0, 150));
    } catch(pe) {
      if (pe.message !== t.substring(0, 150)) throw pe;
      throw new Error(`BC ${r.status}: ${t.substring(0, 150)}`);
    }
  }
  return r.json().catch(() => null);
}

/* ══════════════════════════════════════
   DRAG & DROP — SLEPEN NAAR ANDERE DAG
══════════════════════════════════════ */
let sleepIdx = null;

function startSleep(event, idx) {
  sleepIdx = idx;
  event.dataTransfer.effectAllowed = 'move';
  setTimeout(() => event.target.classList.add('sleep-actief'), 0);
}

function stopSleep(event) {
  event.target.classList.remove('sleep-actief');
  sleepIdx = null;
}

function sleepOver(event) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  event.currentTarget.classList.add('sleep-doel');
}

function sleepWeg(event) {
  event.currentTarget.classList.remove('sleep-doel');
}

async function latVallen(event, nieuweDatum, catType) {
  event.preventDefault();
  event.currentTarget.classList.remove('sleep-doel');
  if (sleepIdx === null) return;

  const {type, item} = opslag[sleepIdx];
  sleepIdx = null;

  if (item.datum === nieuweDatum) return; // geen wijziging

  if (!verbonden) { toon('Niet verbonden met BC'); return; }
  if (!item._raw?.id) { toon('Order heeft geen ID — niet bij te werken'); return; }

  const orderId = item._raw.id;
  let endpoint, body;

  if (type === 'inkoop') {
    endpoint = `/companies(${bcBedrijfId})/purchaseOrders(${orderId})`;
    body = { requestedReceiptDate: nieuweDatum };
  } else {
    endpoint = `/companies(${bcBedrijfId})/salesOrders(${orderId})`;
    // Transport = toegezegde leverdatum (promisedDeliveryDate)
    // Productie = verzochte leverdatum (requestedDeliveryDate)
    body = type === 'transport'
      ? { promisedDeliveryDate: nieuweDatum }
      : { requestedDeliveryDate: nieuweDatum };
  }

  toon('Datum bijwerken in BC…');
  try {
    await bcPatch(endpoint, body);
    toon('✓ Datum bijgewerkt naar ' + fDatum(nieuweDatum));
    item.datum = nieuweDatum;
    teken();
    setTimeout(() => haalData(), 2000);
  } catch(e) {
    console.error('PATCH fout:', e);
    // Als requestedDeliveryDate geblokkeerd wordt, probeer promisedDeliveryDate
    if (type === 'productie' && e.message.includes('kunt d')) {
      try {
        await bcPatch(endpoint, { promisedDeliveryDate: nieuweDatum });
        toon('✓ Datum bijgewerkt naar ' + fDatum(nieuweDatum));
        item.datum = nieuweDatum;
        teken();
        setTimeout(() => haalData(), 2000);
        return;
      } catch(e2) { /* toon originele fout */ }
    }
    toon('⚠ Datum niet bijgewerkt: ' + e.message.substring(0, 100));
  }
}

/* ══════════════════════════════════════
   DATA OPHALEN UIT BC
   - Inkoop:    inkooporders op expectedReceiptDate
   - Productie: verkooporders op dueDate (vervaldatum)
   - Transport: verkooporders op requestedDeliveryDate (toegezegde leverdatum)
══════════════════════════════════════ */
async function haalData() {
  if (!verbonden || !bcBedrijfId) return;

  const dagen = weekDagen(pagina);
  const van   = iso(dagen[0]);
  const tot   = iso(dagen[6]);

  updateBCKnop('bezig');
  try {
    // Haal inkooporders op — probeer verschillende datumvelden, zonder expand
    const poDateVelden = ['requestedReceiptDate','expectedReceiptDate','dueDate','orderDate'];
    let poRes = null;
    for (const veld of poDateVelden) {
      try {
        poRes = await bcGet(
          `/companies(${bcBedrijfId})/purchaseOrders` +
          `?$filter=${veld} ge ${van} and ${veld} le ${tot}`
        );
        console.log('Inkooporder datumveld gevonden:', veld);
        break;
      } catch(e) {
        if (!e.message.includes('Could not find a property')) throw e;
      }
    }
    if (!poRes) poRes = { value: [] };

    // Haal verkooporders op voor Productie — filtereer op requestedDeliveryDate (vervaldatum)
    let soPrdRes = null;
    try {
      soPrdRes = await bcGet(
        `/companies(${bcBedrijfId})/salesOrders` +
        `?$filter=requestedDeliveryDate ge ${van} and requestedDeliveryDate le ${tot}`
      );
    } catch(e) {
      soPrdRes = { value: [] };
    }
    if (!soPrdRes) soPrdRes = { value: [] };
    console.log('Productie orders gevonden:', soPrdRes.value?.length);

    // Als 0 resultaten met datum filter, haal alle orders op voor debug
    if (soPrdRes.value?.length === 0) {
      try {
        const alleRes = await bcGet(`/companies(${bcBedrijfId})/salesOrders?$top=5`);
        if (alleRes?.value?.length > 0) {
          console.log('DEBUG - sample salesOrder velden:', Object.keys(alleRes.value[0]));
          console.log('DEBUG - sample order:', JSON.stringify(alleRes.value[0]).substring(0, 500));
        } else {
          console.log('DEBUG - geen open verkooporders gevonden in BC');
        }
      } catch(e) {}
    }

    // Transport — zelfde data, maar apart zoeken (kan later ander veld worden)
    const soTrnRes = soPrdRes;

    liveData = {
      inkoop:    verwerkInkoop(poRes),
      productie: verwerkProductie(soPrdRes),
      transport: verwerkTransport(soTrnRes)
    };

    teken();
    updateBCKnop('ok');
  } catch(e) {
    console.error('BC data fout:', e);
    toon('Datafout: ' + e.message);
    updateBCKnop('fout');
    liveData = null;
    teken();
  }
}

function verwerkInkoop(res) {
  const uit = [];
  (res.value || []).forEach(po => {
    const datum = (po.requestedReceiptDate || po.expectedReceiptDate || po.dueDate || po.orderDate || '').substring(0,10);
    if (!datum) return;
    uit.push({
      datum,
      ref:         po.number,
      leverancier: po.vendorName || po.vendorNumber || '—',
      artikel:     '',
      hoeveelheid: '',
      _raw:        po
    });
  });
  return uit;
}

function verwerkProductie(res) {
  const uit = [];
  (res.value || []).forEach(so => {
    // Vervaldatum = requestedDeliveryDate (beschikbaar in deze omgeving)
    const datum = (so.requestedDeliveryDate || so.orderDate || '').substring(0,10);
    if (!datum) return;
    uit.push({
      datum,
      ref:         so.number,
      klant:       so.customerName || so.customerNumber || '—',
      artikel:     '',
      hoeveelheid: '',
      orderdatum:  (so.orderDate || '').substring(0,10),
      _raw:        so
    });
  });
  return uit;
}

function verwerkTransport(res) {
  const uit = [];
  (res.value || []).forEach(so => {
    // Toegezegde leverdatum = requestedDeliveryDate
    const datum = (so.requestedDeliveryDate || so.orderDate || '').substring(0,10);
    if (!datum) return;
    uit.push({
      datum,
      ref:         so.number,
      klant:       so.customerName || so.customerNumber || '—',
      artikel:     '',
      hoeveelheid: '',
      vervaldatum: datum,
      _raw:        so
    });
  });
  return uit;
}

/* ══════════════════════════════════════
   BC KNOP
══════════════════════════════════════ */
function updateBCKnop(staat) {
  const knop = document.getElementById('bcKnop');
  const balk = document.getElementById('statusBalk');
  const pill = document.getElementById('statusPill');
  const tekst = document.getElementById('statusTekst');

  if (staat === 'bezig') {
    knop.innerHTML = `<span class="bc-stip busy"></span> Bezig…`;
    knop.classList.remove('groen');
    return;
  }
  if (staat === 'fout') {
    knop.innerHTML = `<span class="bc-stip fout"></span> Fout – opnieuw`;
    knop.classList.remove('groen');
    return;
  }
  if (verbonden) {
    knop.innerHTML = `<span class="bc-stip ok"></span> ${gebruikerInit} · BC verbonden`;
    knop.classList.add('groen');
    balk.classList.add('live');
    pill.textContent = 'LIVE';
    tekst.textContent = `Verbonden met Business Central · ${BC_CO_NAAM}`;
  } else {
    knop.textContent = 'Verbinden met BC';
    knop.classList.remove('groen');
    balk.classList.remove('live');
    pill.textContent = 'DEMO';
    tekst.textContent = 'Testdata — nog niet verbonden met Business Central.';
  }
}

/* ══════════════════════════════════════
   TESTDATA (als BC niet verbonden is)
══════════════════════════════════════ */
function dagOffset(n) {
  const d = new Date(VANDAAG); d.setDate(d.getDate()+n); return iso(d);
}
const testInkoop = [
  { datum: dagOffset(0), ref:'IO-001', leverancier:'Agrifirm',   artikel:'Legmeel fijn',    hoeveelheid:1200 },
  { datum: dagOffset(1), ref:'IO-002', leverancier:'De Heus',    artikel:'Vleeskuikenmix',  hoeveelheid:800  },
  { datum: dagOffset(3), ref:'IO-003', leverancier:'ForFarmers', artikel:'Biggenkorrel',    hoeveelheid:1600 },
];
const testProductie = [
  { datum: dagOffset(0), ref:'VO-101', klant:'Boerderij Jansen', artikel:'Legmeel fijn',    hoeveelheid:1500, orderdatum: dagOffset(-3) },
  { datum: dagOffset(2), ref:'VO-102', klant:'Veehouderij Piet', artikel:'Vleeskuikenmix',  hoeveelheid:1200, orderdatum: dagOffset(-2) },
];
const testTransport = [
  { datum: dagOffset(1), ref:'VO-101', klant:'Boerderij Jansen', artikel:'Legmeel fijn',    hoeveelheid:1500, vervaldatum: dagOffset(0) },
  { datum: dagOffset(4), ref:'VO-102', klant:'Veehouderij Piet', artikel:'Vleeskuikenmix',  hoeveelheid:1200, vervaldatum: dagOffset(2) },
];

/* ══════════════════════════════════════
   TEKEN
══════════════════════════════════════ */
function teken() {
  opslag.length = 0;

  const dagen  = weekDagen(pagina);
  const eerste = dagen[0];
  const laatste = dagen[6];
  const wn     = isoWeekNr(eerste);

  // Week info
  const zelfdeMaand = eerste.getMonth() === laatste.getMonth();
  const bereik = zelfdeMaand
    ? `${eerste.getDate()} t/m ${laatste.getDate()} ${MAANDNAMEN[laatste.getMonth()]} ${laatste.getFullYear()}`
    : `${eerste.getDate()} ${MAANDNAMEN[eerste.getMonth()]} t/m ${laatste.getDate()} ${MAANDNAMEN[laatste.getMonth()]} ${laatste.getFullYear()}`;

  document.getElementById('weekNr').textContent    = wn;
  document.getElementById('weekDatums').textContent = bereik;
  document.getElementById('huidigBadge').style.display = pagina === 0 ? 'inline-flex' : 'none';
  document.getElementById('knopVorig').disabled    = pagina === 0;
  document.getElementById('knopVolgend').disabled  = pagina >= MAX_P - 1;

  const srcInkoop    = liveData?.inkoop    ?? testInkoop;
  const srcProductie = liveData?.productie ?? testProductie;
  const srcTransport = liveData?.transport ?? testTransport;

  const dagIsos = dagen.map(iso);
  const wInk = srcInkoop.filter(x => dagIsos.includes(x.datum));
  const wPrd = srcProductie.filter(x => dagIsos.includes(x.datum));
  const wTrn = srcTransport.filter(x => dagIsos.includes(x.datum));

  const kgInk = wInk.reduce((a,x) => a+(x.hoeveelheid||0), 0);
  const kgPrd = wPrd.reduce((a,x) => a+(x.hoeveelheid||0), 0);
  const kgTrn = wTrn.reduce((a,x) => a+(x.hoeveelheid||0), 0);

  document.getElementById('totInkoop').textContent =
    `${(kgInk/1000).toLocaleString('nl-NL',{maximumFractionDigits:1})} t · ${wInk.length}`;
  document.getElementById('totProductie').textContent =
    `${(kgPrd/1000).toLocaleString('nl-NL',{maximumFractionDigits:1})} t · ${wPrd.length}`;
  document.getElementById('totTransport').textContent =
    `${(kgTrn/1000).toLocaleString('nl-NL',{maximumFractionDigits:1})} t · ${wTrn.length}`;

  // Rij-gebaseerde layout
  const tl = document.getElementById('tijdlijn');
  const dagLijst = weekendOpen ? dagen : dagen.slice(0, 5);
  const kolommen = dagLijst.length;
  tl.style.minWidth = weekendOpen ? '1200px' : '860px';

  function cls(d) {
    const ds = iso(d);
    const v = ds === iso(VANDAAG);
    const w = isWeekend(d);
    return { ds, v, w, extra: (v?' vandaag':'') + (w?' weekend':'') };
  }

  const wkndKnop = weekendOpen
    ? `<div class="weekend-blok" onclick="toggleWeekend()" title="Weekend verbergen">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="weekend-tekst">Za + Zo</span>
       </div>`
    : `<div class="weekend-blok" onclick="toggleWeekend()" title="Weekend tonen">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="weekend-tekst">Za + Zo</span>
       </div>`;

  const cats = [
    { key:'inkoop',    src:srcInkoop,    label:`${ICO_INKOOP}Inkoop`,    leeg:'Geen aanvoer'  },
    { key:'productie', src:srcProductie, label:`${ICO_PROD}Productie`,   leeg:'Geen productie'},
    { key:'transport', src:srcTransport, label:`${ICO_TRANS}Transport`,  leeg:'Geen transport'},
  ];

  // Bouw de rijen-kolom (zonder weekend-blok)
  let rijHtml = '';
  const kolCss = `repeat(${kolommen}, minmax(0, 1fr))`;

  // RIJ 1: dag-headers
  rijHtml += `<div class="tl-rij" style="grid-template-columns:${kolCss}">`;
  dagLijst.forEach(d => {
    const {ds, v, w, extra} = cls(d);
    rijHtml += `<div class="tl-dag-hoofd${extra}">
      ${v ? '<span class="vandaag-pip">Vandaag</span>' : ''}
      <div class="dag-naam">${DAGAMEN(d.getDay())}</div>
      <div class="dag-datum">${d.getDate()}</div>
      <div class="dag-maand">${MAANDNAMEN[d.getMonth()]}</div>
    </div>`;
  });
  rijHtml += `</div>`;

  // RIJEN 2-4: categorie-rijen met drag & drop (flex:1 zodat ze groeien)
  cats.forEach(cat => {
    rijHtml += `<div class="tl-rij" style="grid-template-columns:${kolCss};flex:1">`;
    dagLijst.forEach(d => {
      const {ds, v, w, extra} = cls(d);
      const items = cat.src.filter(x => x.datum === ds);
      const rijen = items.length
        ? items.map(item => {
            const i = bewaar({type: cat.key, item, d});
            const naam = cat.key === 'inkoop' ? (item.leverancier||'—') : (item.klant||'—');
            return `<div class="item ${cat.key}" draggable="true"
              onclick="toonDetail(${i})"
              ondragstart="startSleep(event,${i})"
              ondragend="stopSleep(event)">
              <div class="item-naam">${esc(naam)}</div>
              <div class="item-sub">${esc(item.ref||'—')}</div>
            </div>`;
          }).join('')
        : `<div class="leeg">${verbonden ? 'Geen orders in BC' : cat.leeg}</div>`;
      rijHtml += `<div class="tl-cat-cel ${cat.key}${extra}"
        ondragover="sleepOver(event)"
        ondragleave="sleepWeg(event)"
        ondrop="latVallen(event,'${ds}','${cat.key}')">
        <div class="cat-label ${cat.key}">${cat.label}</div>
        <div class="cat-body">${rijen}</div>
      </div>`;
    });
    rijHtml += `</div>`;
  });

  // RIJ 5: notities
  rijHtml += `<div class="tl-rij" style="grid-template-columns:${kolCss}">`;
  dagLijst.forEach(d => {
    const {ds, v, w, extra} = cls(d);
    const notitie = notities[ds] || null;
    const notTekst = notitie ? esc(notitie.tekst) : '';
    const notitieInfo = notitie
      ? `<div class="notitie-info" id="ni-${ds}">
           <span class="notitie-init">${notitie.init}</span>
           <span class="notitie-tijd">${notitie.tijdstip}</span>
         </div>`
      : `<div class="notitie-info" id="ni-${ds}" style="display:none"></div>`;
    rijHtml += `<div class="tl-not-cel${extra}">
      <div class="notitie-label">${ICO_PEN}Notitie</div>
      <textarea class="notitie-veld" id="nt-${ds}"
        placeholder="Voeg een notitie toe…"
        onblur="slaNotitieOp('${ds}')">${notTekst}</textarea>
      ${notitieInfo}
      <div class="opgeslagen-ind" id="oi-${ds}">✓ Opgeslagen</div>
    </div>`;
  });
  rijHtml += `</div>`;

  tl.innerHTML = `<div class="tijdlijn-rijen">${rijHtml}</div>${wkndKnop}`;
}

function DAGAMEN(n) { return DAGAMEN._d ? DAGAMEN._d[n] : (DAGAMEN._d = DAGAMEN_arr())[n]; }
function DAGAMEN_arr() { return ['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag']; }

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ══════════════════════════════════════
   NOTITIE OPSLAAN
══════════════════════════════════════ */
function slaNotitieOp(ds) {
  const ta = document.getElementById('nt-'+ds);
  if (!ta) return;
  const tekst = ta.value.trim();
  const nu = new Date();
  const tijdstip = `${DAGAMEN_arr()[nu.getDay()].toLowerCase()} ${nu.getDate()} ${MAANDNAMEN[nu.getMonth()]} · ${pad(nu.getHours())}:${pad(nu.getMinutes())}`;

  if (tekst) {
    notities[ds] = { tekst, init: gebruikerInit, tijdstip };
  } else {
    delete notities[ds];
  }

  const ni = document.getElementById('ni-'+ds);
  if (ni) {
    if (notities[ds]) {
      ni.innerHTML = `<span class="notitie-init">${gebruikerInit}</span><span class="notitie-tijd">${tijdstip}</span>`;
      ni.style.display = 'flex';
    } else {
      ni.style.display = 'none';
    }
  }
  const oi = document.getElementById('oi-'+ds);
  if (oi) { oi.classList.add('aan'); clearTimeout(oi._t); oi._t = setTimeout(() => oi.classList.remove('aan'), 1800); }
}

/* ══════════════════════════════════════
   DETAIL MODAL
══════════════════════════════════════ */
function rij(label, waarde, groot) {
  if (!waarde && waarde !== 0) return '';
  return `<div class="rij"><span class="rij-label">${label}</span><span class="rij-waarde${groot?' groot':''}">${waarde}</span></div>`;
}

function toonDetail(idx) {
  const {type, item, d} = opslag[idx];
  const r = item._raw || {};
  const datumStr = `${DAGAMEN_arr()[d.getDay()].toLowerCase()} ${d.getDate()} ${MAANDNAMEN[d.getMonth()]} ${d.getFullYear()}`;

  const badge = document.getElementById('modalType');
  badge.className = 'modal-type ' + type;
  badge.textContent = {inkoop:'Inkoop',productie:'Productie',transport:'Transport'}[type];

  const hoofdNaam = type === 'inkoop' ? (item.leverancier || '—') : (item.klant || '—');
  document.getElementById('modalNaam').textContent  = hoofdNaam;
  document.getElementById('modalDatum').textContent = datumStr;

  let rijen = '';
  if (type === 'inkoop') {
    rijen += rij('Ordernummer',          esc(r.number || item.ref));
    rijen += rij('Leverancier',          esc(r.vendorName));
    rijen += rij('Leveranciersnummer',   esc(r.vendorNumber));
    rijen += rij('Status',               esc(r.status));
    rijen += rij('Orderdatum',           fDatum((r.orderDate||'').substring(0,10)));
    rijen += rij('Boekingsdatum',        fDatum((r.postingDate||'').substring(0,10)));
    rijen += rij('Verw. ontvangstdatum', fDatum((r.requestedReceiptDate || r.expectedReceiptDate || r.dueDate || '').substring(0,10)));
    rijen += rij('Extern documentnr.',   esc(r.externalDocumentNumber));
    rijen += rij('Valuta',               esc(r.currencyCode));
    rijen += rij('Totaal excl. BTW',     r.totalAmountExcludingTax != null ? '€ ' + r.totalAmountExcludingTax.toLocaleString('nl-NL',{minimumFractionDigits:2}) : null);
    rijen += rij('BTW',                  r.totalTaxAmount != null ? '€ ' + r.totalTaxAmount.toLocaleString('nl-NL',{minimumFractionDigits:2}) : null);
    rijen += rij('Totaal incl. BTW',     r.totalAmountIncludingTax != null ? '€ ' + r.totalAmountIncludingTax.toLocaleString('nl-NL',{minimumFractionDigits:2}) : null, true);
  } else {
    rijen += rij('Ordernummer',          esc(r.number || item.ref));
    rijen += rij('Klantnaam',            esc(r.customerName));
    rijen += rij('Klantnummer',          esc(r.customerNumber));
    rijen += rij('Status',               esc(r.status));
    rijen += rij('Orderdatum',           fDatum((r.orderDate||'').substring(0,10)));
    rijen += rij('Boekingsdatum',        fDatum((r.postingDate||'').substring(0,10)));
    rijen += rij('Vervaldatum',          fDatum((r.requestedDeliveryDate||'').substring(0,10)));
    rijen += rij('Toegezegde leverdatum',fDatum((r.promisedDeliveryDate||'').substring(0,10)));
    rijen += rij('Extern documentnr.',   esc(r.externalDocumentNumber));
    rijen += rij('Verkoper',             esc(r.salesperson));
    rijen += rij('Levermethode',         esc(r.shipmentMethodCode || r.shipmentMethodId));
    rijen += rij('Afleveradres',         r.shipToName ? esc(r.shipToName) + (r.shipToCity ? ', ' + esc(r.shipToCity) : '') : null);
    rijen += rij('Valuta',               esc(r.currencyCode));
    rijen += rij('Totaal excl. BTW',     r.totalAmountExcludingTax != null ? '€ ' + r.totalAmountExcludingTax.toLocaleString('nl-NL',{minimumFractionDigits:2}) : null);
    rijen += rij('BTW',                  r.totalTaxAmount != null ? '€ ' + r.totalTaxAmount.toLocaleString('nl-NL',{minimumFractionDigits:2}) : null);
    rijen += rij('Totaal incl. BTW',     r.totalAmountIncludingTax != null ? '€ ' + r.totalAmountIncludingTax.toLocaleString('nl-NL',{minimumFractionDigits:2}) : null, true);
  }

  const orderId = r.id || null;
  const detailKnop = orderId && verbonden ? `
    <button class="detail-knop" onclick="haalOrderRegels('${orderId}', '${type}')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Gedetailleerde informatie — orderregels ophalen
    </button>
    <div id="regelsSectie"></div>
  ` : '';

  document.getElementById('modalBody').innerHTML = rijen + detailKnop;
  document.getElementById('modal').classList.add('open');
}

async function haalOrderRegels(orderId, type) {
  const sectie = document.getElementById('regelsSectie');
  if (!sectie) return;
  sectie.innerHTML = `<div class="regels-laadbericht">Orderregels ophalen...</div>`;

  try {
    let endpoint, labelCol;
    if (type === 'inkoop') {
      endpoint = `/companies(${bcBedrijfId})/purchaseOrders(${orderId})/purchaseOrderLines`;
      labelCol = 'Artikel';
    } else {
      endpoint = `/companies(${bcBedrijfId})/salesOrders(${orderId})/salesOrderLines`;
      labelCol = 'Artikel';
    }
    const res = await bcGet(endpoint);
    const regels = (res.value || []).filter(r => !r.lineType || ['Item','item',''].includes(r.lineType));

    if (!regels.length) {
      sectie.innerHTML = `<div class="regels-sectie"><div class="regels-titel">Orderregels</div><div class="regels-laadbericht">Geen regels gevonden</div></div>`;
      return;
    }

    const kolommen = type === 'inkoop'
      ? ['Nr.', 'Omschrijving', 'Eenheid', 'Hoeveelheid', 'Prijs', 'Bedrag']
      : ['Nr.', 'Omschrijving', 'Eenheid', 'Hoeveelheid', 'Prijs', 'Bedrag', 'Leverdatum'];

    let tabelHtml = `<div class="regels-sectie"><div class="regels-titel">Orderregels (${regels.length})</div>
      <table class="regels-tabel"><thead><tr>${kolommen.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>`;

    regels.forEach(r => {
      const bedrag = r.amountExcludingTax != null
        ? '€ ' + r.amountExcludingTax.toLocaleString('nl-NL',{minimumFractionDigits:2})
        : (r.lineAmount != null ? '€ ' + r.lineAmount.toLocaleString('nl-NL',{minimumFractionDigits:2}) : '—');
      const prijs = r.unitPrice != null ? '€ ' + r.unitPrice.toLocaleString('nl-NL',{minimumFractionDigits:2}) : '—';
      const hoeveelheid = r.quantity != null ? r.quantity.toLocaleString('nl-NL') : '—';
      if (type === 'inkoop') {
        tabelHtml += `<tr>
          <td>${esc(r.lineObjectNumber || r.itemId || '—')}</td>
          <td>${esc(r.description || '—')}</td>
          <td>${esc(r.unitOfMeasureCode || '—')}</td>
          <td class="num">${hoeveelheid}</td>
          <td class="num">${prijs}</td>
          <td class="num">${bedrag}</td>
        </tr>`;
      } else {
        const leverdatum = (r.shipmentDate || r.requestedDeliveryDate || '').substring(0,10);
        tabelHtml += `<tr>
          <td>${esc(r.lineObjectNumber || r.itemId || '—')}</td>
          <td>${esc(r.description || '—')}</td>
          <td>${esc(r.unitOfMeasureCode || '—')}</td>
          <td class="num">${hoeveelheid}</td>
          <td class="num">${prijs}</td>
          <td class="num">${bedrag}</td>
          <td>${leverdatum ? fDatum(leverdatum) : '—'}</td>
        </tr>`;
      }
    });

    tabelHtml += '</tbody></table></div>';
    sectie.innerHTML = tabelHtml;
  } catch(e) {
    sectie.innerHTML = `<div class="regels-sectie"><div class="regels-laadbericht" style="color:var(--rood)">Fout: ${esc(e.message)}</div></div>`;
  }
}

function sluitModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') sluitModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') sluitModal(); });

/* ══════════════════════════════════════
   NAVIGATIE
══════════════════════════════════════ */
function vorigeWeek() {
  if (pagina > 0) { pagina--; teken(); haalData(); toon('Week ' + isoWeekNr(weekDagen(pagina)[0])); }
}
function volgendeWeek() {
  if (pagina < MAX_P-1) { pagina++; teken(); haalData(); toon('Week ' + isoWeekNr(weekDagen(pagina)[0])); }
}
function naarVandaag() { pagina = 0; teken(); haalData(); toon('Terug naar deze week'); }

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
function toon(bericht) {
  const t = document.getElementById('toast');
  document.getElementById('toastTekst').textContent = bericht;
  t.classList.add('zichtbaar');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('zichtbaar'), 2500);
}

/* ══════════════════════════════════════
   START
══════════════════════════════════════ */
teken();
initMsal();
</script>
